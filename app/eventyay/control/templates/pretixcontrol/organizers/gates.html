{% if gates %}

    <table class="table table-condensed table-hover">
        <thead>
            <tr>
                <th>{% trans "Gate" %}</th>
                <th></th>
            </tr>
        </thead>

        <tbody>
            {% for g in gates %}
                <tr>
                    <td>
                        <strong>
                            <a href="{% url 'eventyay_common:organizer.gates.edit' organizer=request.organizer.slug gate=g.id %}">
                                {{ g.name }}
                            </a>
                        </strong>
                    </td>

                    <td class="text-right flip">
                        <a href="{% url 'eventyay_common:organizer.gates.edit' organizer=request.organizer.slug gate=g.id %}"
                           class="btn btn-default btn-sm">
                            <i class="fa fa-edit"></i>
                        </a>

                        <a href="{% url 'eventyay_common:organizer.gates.delete' organizer=request.organizer.slug gate=g.id %}"
                           class="btn btn-delete btn-danger btn-sm">
                            <i class="fa fa-trash"></i>
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

{% else %}

    <p>
        {% trans "No gates created yet. Create a new gate to view it here." %}
    </p>

{% endif %}
